# slam_toolbox online-async mapping for Nori (Stage 7A).
# Consumes /scan + the odom->base_link TF, publishes /map and the map->odom TF.
# Everything runs in wall-clock time (no /clock in sim), so use_sim_time: false.
slam_toolbox:
  ros__parameters:
    # --- solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- frames / topics ---
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: false

    # --- map ---
    resolution: 0.05
    max_laser_range: 8.0
    map_update_interval: 1.0
    transform_publish_period: 0.05
    transform_timeout: 0.3
    tf_buffer_duration: 30.0

    # --- scan matching / when to add a node to the graph ---
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15
    minimum_time_interval: 0.3
    throttle_scans: 1
    scan_buffer_size: 10
    link_match_minimum_response_fine: 0.1
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
